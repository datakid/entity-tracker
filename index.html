                  <span style="font-size:13px;font-weight:600;color:var(--ink-8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(h.name)}</span>
                  <span style="font-size:13px;font-weight:800;color:var(--fg);flex-shrink:0;margin-inline-start:8px;">${fmt(h.total)}${unit}</span>
                </div>
                <div class="bar-track"><div class="bar-fill" style="width:${(h.total/maxTop)*100}%;"></div></div>
              </div>
            </div>`).join('')}
        </div>
        <div class="glass p col-2">
          <h3 class="card-title">${t('dash_moversTitle')}</h3>
          <p style="font-size:12.5px;color:var(--muted2);margin:5px 0 12px;">${t('dash_moversSub')}</p>
          ${movers.length ? movers.map(({r,d})=>`
            <div class="mover-item">
              <div style="min-width:0;">
                <div class="mover-name">${esc(r.name)}</div>
                <div class="mover-meta">${esc(budgetLabel(r.budgetType))} · ${esc(monthName(r.month))} ${r.year}</div>
              </div>
              <div class="mover-val" style="color:${d>0?'var(--bad)':'var(--good)'};">${d>0?'+':'−'}${fmt(Math.abs(d))}${unit}</div>
            </div>`).join('') : `<div class="empty">${t('dash_noData')}</div>`}
        </div>
      </div>`;
    chart.wire(body);
  }

  main.querySelector('#dashEntity').addEventListener('input', (e)=>{ filterEntity = e.target.value; render(); });
  main.querySelector('#resetFiltersBtn').addEventListener('click', ()=>{
    filterYear = 'all'; filterType = 'all'; filterCategory = 'all'; filterEntity = '';
    setCselDisplay('filterYear','all'); setCselDisplay('filterType','all'); setCselDisplay('filterCategory','all');
    main.querySelector('#dashEntity').value = '';
    render();
  });
  main.querySelector('#dashExportBtn').addEventListener('click', ()=>{
    const records = compute();
    if(!records.length){ toast(t('dash_noData'), 'err'); return; }
    exportRecords(records, lang==='ar' ? 'لوحة_التحكم_مصفّاة' : 'dashboard_filtered');
  });
  render();
}

function renderHospitalsTab(main){
  let query = pendingHospitalSearch || ''; pendingHospitalSearch = null;
  let sortKey='name', sortDir=1, editingId=null, groupBy='none', trendFilter='all', limit=TABLE_PAGE;
  const collapsedGroups = new Set();
  const selectedIds = new Set();

  main.innerHTML = `
  <div class="glass p">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;">
      <div>
        <h2 class="card-title"><span style="height:32px;width:32px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-light);">${icon('building',16)}</span>${t('hosp_title')}</h2>
        <p class="card-sub" id="countLabel"></p>
      </div>
      <div class="toolbar">
        <div class="search-wrap">${icon('search',15)}<input class="inp" id="searchInput" type="search" autocomplete="off" aria-label="${esc(t('hosp_searchPh'))}" placeholder="${t('hosp_searchPh')}" value="${esc(query)}"></div>
        <button class="btn-ghost" id="exportBtn">${icon('download',14)} ${t('hosp_export')}</button>
        <button class="btn-ghost btn-accent" id="importShortcut">${icon('upload',14)} ${t('hosp_import')}</button>
      </div>
    </div>
    <div class="toolbar" id="bulkBar" style="margin-bottom:10px;display:none;">
      <span style="font-size:12.5px;color:var(--muted2);" id="bulkCount"></span>
      <button class="btn-ghost btn-danger" id="bulkDeleteBtn">${icon('trash',13)} ${t('bulk_deleteSelected')}</button>
      <button class="link-btn" id="bulkClearBtn">${t('bulk_clearSelection')}</button>
    </div>
    <div class="toolbar" style="margin-bottom:10px;">
      <span style="font-size:12.5px;color:var(--muted2);">${t('hosp_groupBy')}</span>
      <div class="seg" id="groupSeg">
        <button class="seg-btn active" data-g="none">${t('hosp_groupNone')}</button>
        <button class="seg-btn" data-g="budgetType">${t('hosp_groupType')}</button>
        <button class="seg-btn" data-g="month">${t('hosp_groupMonth')}</button>
        <button class="seg-btn" data-g="category">${t('hosp_groupCategory')}</button>
      </div>
    </div>
    <div class="toolbar" style="margin-bottom:16px;">
      <span style="font-size:12.5px;color:var(--muted2);">${t('hosp_trend')}</span>
      <div class="seg" id="trendSeg">
        <button class="seg-btn active" data-tr="all">${t('hosp_trendAll')}</button>
        <button class="seg-btn" data-tr="up">${icon('trendup',12)} ${t('hosp_trendUp')}</button>
        <button class="seg-btn" data-tr="down">${icon('trenddown',12)} ${t('hosp_trendDown')}</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr id="theadRow"></tr></thead><tbody id="tbody"></tbody></table>
    </div>
    <div id="emptyMsg"></div>
    <div class="pager" id="pager"></div>
  </div>`;

  const cols = [
    {key:'name', label:t('col_name')}, {key:'category', label:t('col_category')}, {key:'budgetType', label:t('col_budget')},
    {key:'month', label:t('col_month')}, {key:'year', label:t('col_year')}, {key:'before', label:t('col_before')}, {key:'after', label:t('col_after')},
  ];

  function renderHead(){
    const thead = main.querySelector('#theadRow');
    const numeric = new Set(['year','before','after']);
    thead.innerHTML = `<th style="width:32px;cursor:default;"><input type="checkbox" id="selectAllChk" aria-label="${esc(t('import_selectAll'))}"></th>` +
      cols.map(c=>{
        const active = sortKey === c.key;
        const ind = active ? `<span class="sort-ind" style="transform:rotate(${sortDir===1?0:180}deg)">${icon('chevron',12)}</span>` : '';
        return `<th data-key="${c.key}" tabindex="0" class="${numeric.has(c.key)?'num':''}" aria-sort="${active?(sortDir===1?'ascending':'descending'):'none'}">${esc(c.label)}${ind}</th>`;
      }).join('') + `<th style="cursor:default;"></th>`;
    const activate = (th)=>{
      if(sortKey === th.dataset.key) sortDir *= -1; else { sortKey = th.dataset.key; sortDir = 1; }
      limit = TABLE_PAGE;
      renderHead();
      updateTable();
    };
    thead.querySelectorAll('th[data-key]').forEach(th=>{
      th.addEventListener('click', ()=> activate(th));
      th.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(th); } });
    });
    thead.querySelector('#selectAllChk').addEventListener('change', (e)=>{
      const filtered = getFiltered();
      if(e.target.checked) filtered.forEach(r=>selectedIds.add(r.id));
      else filtered.forEach(r=>selectedIds.delete(r.id));
      updateTable();
    });
  }

  function getFiltered(){
    const tokens = queryTokens(query);
    let rows = state.records.filter(r => matchesTokens(r, tokens));
    if(trendFilter === 'up') rows = rows.filter(r=>r.after > r.before);
    else if(trendFilter === 'down') rows = rows.filter(r=>r.after < r.before);
    const keyOf = (r)=> sortKey === 'budgetType' ? budgetLabel(r.budgetType) : r[sortKey];
    rows.sort((a,b)=>{
      const av = keyOf(a), bv = keyOf(b);
      const c = (typeof av === 'string' || typeof bv === 'string') ? collate(String(av ?? ''), String(bv ?? '')) : (av || 0) - (bv || 0);
      return c ? sortDir * c : 0;
    });
    return rows;
  }

  function editRowHtml(r){
    return `<tr data-id="${esc(r.id)}" class="edit-row">
      <td></td>
      <td><input class="mini-inp e-name" maxlength="200" aria-label="${esc(t('col_name'))}" value="${esc(r.name)}"></td>
      <td><input class="mini-inp e-category" maxlength="100" aria-label="${esc(t('col_category'))}" value="${esc(r.category)}"></td>
      <td>${csel('editBudget-'+r.id, BUDGET_KEYS_ALL.map(k=>({value:k,label:budgetLabel(k)})), r.budgetType, null, {mini:true})}</td>
      <td>${csel('editMonth-'+r.id, (lang==='ar'?MONTHS_AR:MONTHS_EN).map((m,i)=>({value:i,label:m})), r.month, null, {mini:true})}</td>
      <td><input class="mini-inp e-year" type="number" min="2000" max="2100" aria-label="${esc(t('col_year'))}" value="${r.year}" style="width:76px;"></td>
      <td><input class="mini-inp e-before" type="number" min="0" step="any" aria-label="${esc(t('col_before'))}" value="${r.before}" style="width:100px;"></td>
      <td><input class="mini-inp e-after" type="number" min="0" step="any" aria-label="${esc(t('col_after'))}" value="${r.after}" style="width:100px;"></td>
      <td><div class="tbl-actions" style="opacity:1;">
        <button type="button" class="icon-btn ok" data-action="save" title="${esc(t('action_save'))}" aria-label="${esc(t('action_save'))}">${icon('check',14)}</button>
        <button type="button" class="icon-btn cancel" data-action="cancel" title="${esc(t('action_cancel'))}" aria-label="${esc(t('action_cancel'))}">${icon('x',14)}</button>
      </div></td>
    </tr>`;
  }
  function viewRowHtml(r, i){
    return `<tr data-id="${esc(r.id)}" style="animation:rise .3s ease ${Math.min(i,10)*0.02}s both;">
      <td><input type="checkbox" class="row-select-chk" data-id="${esc(r.id)}" aria-label="${esc(t('bulk_select'))}" ${selectedIds.has(r.id)?'checked':''}></td>
      <td style="font-weight:600;color:var(--fg);">${esc(r.name)}</td>
      <td>${esc(r.category)||'—'}</td>
      <td>${budgetTag(r.budgetType)}</td>
      <td>${esc(monthName(r.month))}</td>
      <td class="num">${r.year}</td>
      <td class="num" style="color:var(--ink-85);font-weight:600;">${fmt(r.before)}${currencyUnit()}</td>
      <td class="num"><span style="color:var(--fg);font-weight:700;">${fmt(r.after)}${currencyUnit()}</span> <span style="margin-inline-start:8px;">${varianceTag(r.before, r.after)}</span></td>
      <td><div class="tbl-actions">
        <button type="button" class="icon-btn" data-action="edit" title="${esc(t('action_edit'))}" aria-label="${esc(t('action_edit'))}">${icon('pencil',13)}</button>
        <button type="button" class="icon-btn danger" data-action="delete" title="${esc(t('acc_delete'))}" aria-label="${esc(t('acc_delete'))}">${icon('trash',13)}</button>
      </div></td>
    </tr>`;
  }

  function groupKeyOf(r){
    if(groupBy==='budgetType') return r.budgetType;
    if(groupBy==='month') return String(r.month);
    if(groupBy==='category') return r.category || '—';
    return null;
  }
  function groupLabelOf(key){
    if(groupBy==='budgetType') return budgetLabel(key);
    if(groupBy==='month') return monthName(Number(key));
    return key;
  }

  function refreshBulkBar(){
    const bar = main.querySelector('#bulkBar');
    if(selectedIds.size===0){ bar.style.display='none'; return; }
    bar.style.display='flex';
    main.querySelector('#bulkCount').textContent = t('bulk_selectedCount',{n:selectedIds.size});
  }

  function updateTable(){
    closeCsel();
    const filtered = getFiltered();
    main.querySelector('#countLabel').textContent = t('hosp_countSuffix',{n:filtered.length,t:state.records.length});
    const tbody = main.querySelector('#tbody');
    const emptyMsg = main.querySelector('#emptyMsg');
    const pager = main.querySelector('#pager');
    refreshBulkBar();
    const selectAllChk = main.querySelector('#selectAllChk');
    if(selectAllChk) selectAllChk.checked = filtered.length > 0 && filtered.every(r=>selectedIds.has(r.id));
    if(filtered.length === 0){
      tbody.innerHTML = ''; pager.innerHTML = '';
      emptyMsg.innerHTML = `<div class="empty">${t('hosp_noMatch')}</div>`;
      return;
    }
    emptyMsg.innerHTML = '';

    let shown = 0, html = '', visibleTotal = 0;
    const renderRows = (rows)=>{
      let out = '';
      for(const r of rows){
        if(shown >= limit) break;
        out += r.id === editingId ? editRowHtml(r) : viewRowHtml(r, shown);
        shown++;
      }
      return out;
    };

    if(groupBy === 'none'){
      visibleTotal = filtered.length;
      html = renderRows(filtered);
    } else {
      const groups = new Map();
      filtered.forEach(r=>{ const k = groupKeyOf(r); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
      groups.forEach((rows, k)=>{
        const subtotal = rows.reduce((sum,r)=>sum+r.after,0);
        const collapsed = collapsedGroups.has(k);
        if(!collapsed) visibleTotal += rows.length;
        html += `<tr class="group-header" data-group="${esc(k)}" tabindex="0" role="button" aria-expanded="${!collapsed}"><td colspan="9">
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <span style="transform:rotate(${collapsed?'-90deg':'0deg'});transition:transform .2s;display:inline-flex;">${icon('chevron',13)}</span>
            ${esc(groupLabelOf(k))} · ${rows.length} ${t('hosp_groupRecords')} · ${t('hosp_groupTotal')}: ${fmt(subtotal)}${currencyUnit()}
          </span>
        </td></tr>`;
        if(!collapsed) html += renderRows(rows);
      });
    }
    tbody.innerHTML = html;
    bindRowSelectChks();

    const remaining = visibleTotal - shown;
    pager.innerHTML = remaining > 0
      ? `<button type="button" class="btn-ghost btn-accent" id="showMoreBtn">${esc(t('hosp_showMore',{n:remaining}))}</button>` : '';
    const more = pager.querySelector('#showMoreBtn');
    if(more) more.addEventListener('click', ()=>{ limit += TABLE_PAGE; updateTable(); });

    tbody.querySelectorAll('tr.group-header').forEach(tr=>{
      const toggle = ()=>{
        const k = tr.dataset.group;
        if(collapsedGroups.has(k)) collapsedGroups.delete(k); else collapsedGroups.add(k);
        updateTable();
      };
      tr.addEventListener('click', toggle);
      tr.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    });
  }
  function bindRowSelectChks(){
    main.querySelectorAll('.row-select-chk').forEach(chk=>{
      chk.addEventListener('click', e=> e.stopPropagation());
      chk.addEventListener('change', ()=>{
        if(chk.checked) selectedIds.add(chk.dataset.id); else selectedIds.delete(chk.dataset.id);
        refreshBulkBar();
        const selectAllChk = main.querySelector('#selectAllChk');
        const filtered = getFiltered();
        if(selectAllChk) selectAllChk.checked = filtered.length > 0 && filtered.every(r=>selectedIds.has(r.id));
      });
    });
  }

  main.querySelector('#bulkDeleteBtn').addEventListener('click', async ()=>{
    const ok = await confirmDialog({ title:t('bulk_deleteTitle',{n:selectedIds.size}), message:t('del_msg'), confirmLabel:t('del_confirmBtn'), cancelLabel:t('del_cancelBtn'), danger:true });
    if(!ok) return;
    rememberUndo();
    state.records = state.records.filter(r=>!selectedIds.has(r.id));
    selectedIds.clear();
    afterRecordsChanged();
    updateTable();
    toast(t('bulk_deleted'), 'ok', undoAction());
  });
  main.querySelector('#bulkClearBtn').addEventListener('click', ()=>{ selectedIds.clear(); updateTable(); });

  const tbodyEl = main.querySelector('#tbody');
  tbodyEl.addEventListener('keydown', (e)=>{
    const tr = e.target.closest('tr.edit-row');
    if(!tr) return;
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); editingId = null; updateTable(); }
    else if(e.key === 'Enter' && e.target.matches('input')){ e.preventDefault(); tr.querySelector('[data-action="save"]').click(); }
  });
  tbodyEl.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const tr = btn.closest('tr');
    const id = tr.dataset.id;
    const action = btn.dataset.action;
    if(action === 'edit'){ editingId = id; updateTable(); }
    else if(action === 'cancel'){ editingId = null; updateTable(); }
    else if(action === 'delete'){
      const ok = await confirmDialog({ title:t('del_title'), message:t('del_msg'), confirmLabel:t('del_confirmBtn'), cancelLabel:t('del_cancelBtn'), danger:true });
      if(!ok) return;
      rememberUndo();
      state.records = state.records.filter(r=>r.id !== id);
      selectedIds.delete(id);
      afterRecordsChanged();
      updateTable();
      toast(t('hosp_deleted'), 'ok', undoAction());
    }
    else if(action === 'save'){
      const idx = state.records.findIndex(r=>r.id === id);
      if(idx < 0) return;
      const name = tr.querySelector('.e-name').value.trim();
      if(!name){ toast(t('entry_nameRequired'), 'err'); tr.querySelector('.e-name').focus(); return; }
      const before = parseAmount(tr.querySelector('.e-before').value);
      const after = parseAmount(tr.querySelector('.e-after').value);
      if(Number.isNaN(before) || Number.isNaN(after)){ toast(t('entry_invalidNumber'), 'err'); return; }
      if(before < 0 || after < 0){ toast(t('entry_negativeNumber'), 'err'); return; }
      const reg = (k)=> cselRegistry[k + id];
      const month = Number(reg('editMonth-') ? reg('editMonth-').value : state.records[idx].month);
      const year = Number(tr.querySelector('.e-year').value) || state.records[idx].year;
      if(!Number.isInteger(year) || year < YEAR_MIN || year > YEAR_MAX){ toast(t('entry_invalidYear'), 'err'); return; }
      if(findDuplicateRecord(name, month, year, id)){
        const ok = await confirmDialog({ title:t('dup_title'), message:t('dup_msg'), confirmLabel:t('dup_confirmBtn'), cancelLabel:t('dup_cancelBtn') });
        if(!ok) return;
      }
      rememberUndo();
      state.records[idx] = {
        ...state.records[idx],
        name, category: tr.querySelector('.e-category').value.trim(),
        budgetType: (reg('editBudget-') && reg('editBudget-').value) || state.records[idx].budgetType,
        month, year, before, after,
        updatedAt: new Date().toISOString(),
      };
      editingId = null;
      afterRecordsChanged();
      updateTable();
      toast(t('hosp_updated'), 'ok', undoAction());
    }
  });

  main.querySelector('#searchInput').addEventListener('input', (e)=>{ query = e.target.value; limit = TABLE_PAGE; updateTable(); });
  main.querySelector('#exportBtn').addEventListener('click', ()=> exportRecords(getFiltered()));
  main.querySelector('#importShortcut').addEventListener('click', ()=> switchTab('import'));
  main.querySelectorAll('#groupSeg .seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      groupBy = btn.dataset.g;
      limit = TABLE_PAGE;
      main.querySelectorAll('#groupSeg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
      updateTable();
    });
  });
  main.querySelectorAll('#trendSeg .seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      trendFilter = btn.dataset.tr;
      limit = TABLE_PAGE;
      main.querySelectorAll('#trendSeg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
      updateTable();
    });
  });

  renderHead();
  updateTable();
}

      <p class="card-sub">${t('acc_emailExplain')}</p>
      <div id="emailAccountBody" style="margin-top:18px;"></div>
    </div>
    <div class="glass p">
      <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" id="deviceSectionToggle">
        <h3 class="card-title"><span style="height:28px;width:28px;border-radius:var(--r-sm);background:var(--divider-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-6);">${icon('link',14)}</span>${t('acc_deviceSection')}</h3>
        <span style="transform:rotate(${deviceSectionOpen?'180deg':'0deg'});transition:transform .2s;display:inline-flex;color:var(--muted2);">${icon('chevron',15)}</span>
      </div>
      <div id="deviceSectionBody" style="${deviceSectionOpen?'':'display:none;'}margin-top:16px;"></div>

  main.querySelector('#deviceSectionToggle').addEventListener('click', ()=>{

function recordScore(r, q, tokens){
  if(!tokens.length) return -Infinity;
  if(matchesTokens(r, tokens)){
    const pos = normalizeText(r.name).indexOf(tokens[0]);
    return 1000 - (pos === -1 ? 400 : pos);
  }
  return fuzzyScore(q, r.name);
}
function fuzzyScore(query, target){
  const q = normalizeText(query), t = normalizeText(target);
  if(!q) return 0;
  if(!t) return -Infinity;
  const idx = t.indexOf(q);
  if(idx !== -1) return 1000 - idx - (t.length - q.length) * 0.05;
  let ti = 0, score = 0, streak = 0;
  for(let qi = 0; qi < q.length; qi++){
    const ch = q[qi];
    let found = false;
    while(ti < t.length){
      if(t[ti] === ch){ found = true; score += 2 + streak; streak++; ti++; break; }
      streak = 0; ti++;
    }
    if(!found) return -Infinity;
  }
  return score;
}

let pendingHospitalSearch = null;
let spotlightIndex = -1, spotlightItems = [], spotlightDebounce = null;

function ensureSpotlight(){
  let el = document.getElementById('spotlightBackdrop');
  if(!el){
    el = document.createElement('div');
    el.id = 'spotlightBackdrop';
    el.className = 'spotlight-backdrop';
    el.innerHTML = `
      <div class="spotlight-modal" role="dialog" aria-modal="true">
        <div class="spotlight-input-wrap">
          ${icon('search',17)}
          <input class="spotlight-input" id="spotlightInput" placeholder="" autocomplete="off">
          <span class="spotlight-kbd">Esc</span>
        </div>
        <div class="spotlight-results" id="spotlightResults" role="listbox"></div>
        <div class="spotlight-footer">
          <span class="spotlight-footer-hint"><span class="spotlight-kbd">↑↓</span><span id="spotlightHintNav"></span></span>
          <span class="spotlight-footer-hint"><span class="spotlight-kbd">↵</span><span id="spotlightHintSelect"></span></span>
          <span class="spotlight-footer-hint"><span class="spotlight-kbd">Esc</span><span id="spotlightHintClose"></span></span>
        </div>
      </div>`;
    document.body.appendChild(el);
    el.addEventListener('click', (e)=>{ if(e.target === el) closeSpotlight(); });
    el.querySelector('#spotlightInput').addEventListener('input', (e)=>{
      const val = e.target.value;
      clearTimeout(spotlightDebounce);
      spotlightDebounce = setTimeout(()=> renderSpotlightResults(val), 70);
    });
  }
  return el;
}
function openSpotlight(){
  closeCsel();
  const el = ensureSpotlight();
  el.querySelector('#spotlightInput').placeholder = t('spotlight_placeholder');
  el.querySelector('#spotlightInput').setAttribute('aria-label', t('spotlight_placeholder'));
  el.querySelector('.spotlight-modal').setAttribute('aria-label', t('spotlight_placeholder'));
  el.querySelector('#spotlightHintNav').textContent = t('spotlight_hintNav');
  el.querySelector('#spotlightHintSelect').textContent = t('spotlight_hintSelect');
  el.querySelector('#spotlightHintClose').textContent = t('spotlight_hintClose');
  requestAnimationFrame(()=> el.classList.add('open'));
  const input = el.querySelector('#spotlightInput');
  input.value = '';
  renderSpotlightResults('', true);
  setTimeout(()=> input.focus(), 30);
}
function closeSpotlight(){
  const el = document.getElementById('spotlightBackdrop');
  if(el) el.classList.remove('open');
  clearTimeout(spotlightDebounce);
  spotlightIndex = -1; spotlightItems = [];
}
function runSpotlightItem(item){
  closeSpotlight();
  item.run();
}
function renderSpotlightResults(query, animate=false){
  const resultsEl = document.getElementById('spotlightResults');
  const q = query.trim();

  const cmdMatches = spotlightCommands()
    .map(c=>({ ...c, score: q ? fuzzyScore(q, c.title) : 0 }))
    .filter(c=> q ? c.score > -Infinity : true)
    .sort((a,b)=>b.score-a.score)
    .slice(0,6);

  const tokens = queryTokens(q);
  const recMatches = !q ? [] : state.records
    .map(r=>({ r, score: recordScore(r, q, tokens) }))
    .filter(x=>x.score > -Infinity)
    .sort((a,b)=>b.score-a.score)
    .slice(0,7);

  spotlightItems = [];
  let html = '';
  const enterCls = animate ? ' spotlight-enter' : '';
  const enterStyle = i => animate ? ` style="animation-delay:${Math.min(i,8)*16}ms"` : '';
  if(cmdMatches.length){
    html += `<div class="spotlight-section-label">${t('spotlight_sectionCommands')}</div>`;
    cmdMatches.forEach(c=>{
      const i = spotlightItems.length;
      spotlightItems.push({ run: c.action });
      html += `<div class="spotlight-item${enterCls}" role="option" data-i="${i}"${enterStyle(i)}>
        <span class="spotlight-item-icon">${icon(c.icon,16)}</span>
        <span class="spotlight-item-title">${esc(c.title)}</span>
      </div>`;
    });
  }
  if(recMatches.length){
    html += `<div class="spotlight-section-label">${t('spotlight_sectionRecords')}</div>`;
    recMatches.forEach(({r})=>{
      const i = spotlightItems.length;
      spotlightItems.push({ run: ()=>{ pendingHospitalSearch = r.name; switchTab('hospitals'); } });
      html += `<div class="spotlight-item${enterCls}" role="option" data-i="${i}"${enterStyle(i)}>
        <span class="spotlight-item-icon">${icon('building',15)}</span>
        <span style="min-width:0;flex:1;">
          <div class="spotlight-item-title">${esc(r.name)}</div>
          <div class="spotlight-item-sub">${esc(r.category||'—')} · ${esc(budgetLabel(r.budgetType))} · ${esc(monthName(r.month))} ${r.year} · ${fmt(r.after)}${currencyUnit()}</div>
        </span>
      </div>`;
    });
  }
  resultsEl.innerHTML = spotlightItems.length ? html : `<div class="spotlight-empty">${t('spotlight_empty')}</div>`;
  spotlightIndex = spotlightItems.length ? 0 : -1;
  spotlightHighlight();
  resultsEl.querySelectorAll('.spotlight-item').forEach(elm=>{
    elm.addEventListener('click', ()=> runSpotlightItem(spotlightItems[Number(elm.dataset.i)]));
  });
}
function spotlightHighlight(){
  const resultsEl = document.getElementById('spotlightResults');
  if(!resultsEl) return;
  resultsEl.querySelectorAll('.spotlight-item').forEach(elm=>{
    const on = Number(elm.dataset.i) === spotlightIndex;
    elm.classList.toggle('hl', on);
    if(on) elm.scrollIntoView({block:'nearest'});
  });
}

document.addEventListener('keydown', (e)=>{
  if(e.code === 'KeyK' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    if(activeModal) return;
    const el = document.getElementById('spotlightBackdrop');
    if(el && el.classList.contains('open')) closeSpotlight(); else openSpotlight();
    return;
  }
  const el = document.getElementById('spotlightBackdrop');
  if(!el || !el.classList.contains('open')) return;
  if(e.key === 'Escape'){ closeSpotlight(); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); if(spotlightItems.length){ spotlightIndex = Math.min(spotlightItems.length-1, spotlightIndex+1); spotlightHighlight(); } }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); if(spotlightItems.length){ spotlightIndex = Math.max(0, spotlightIndex-1); spotlightHighlight(); } }
  else if(e.key === 'Enter'){ e.preventDefault(); if(spotlightIndex>=0 && spotlightItems[spotlightIndex]) runSpotlightItem(spotlightItems[spotlightIndex]); }
});
